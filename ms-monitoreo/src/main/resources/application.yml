server:
  port: 8086

spring:
  application:
    name: ms-monitoreo

  # Broker de eventos (en docker-compose apunta al servicio "kafka")
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-monitoreo
      # Desde la primera vez que arranca, lee todo el log disponible.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/9150f81f-b0fc-436d-998d-dcb5cf883d2e/v2.0}

# Prueba local sin Azure (AUTH_BYPASS=true): no se exige JWT.
# Por defecto false => autenticacion completa con Microsoft Entra ID.
app:
  auth:
    bypass: ${AUTH_BYPASS:false}
    # Segundo emisor de identidad aceptado: Amazon Cognito (cuentas propias
    # de la tienda). Vacio = solo Microsoft Entra ID.
    cognito-issuer: ${COGNITO_ISSUER_URL:}
