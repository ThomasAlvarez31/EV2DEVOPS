<header class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" routerLink="/" (click)="menuAbierto = false">
      <span class="navbar-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </span>
      <span class="navbar-nombre">Pedidos<span class="acento">360</span></span>
    </a>

    <form class="navbar-search" #formulario="ngForm" (ngSubmit)="buscar(formulario)" role="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" name="q" [(ngModel)]="terminoBusqueda" placeholder="Buscar productos..."
             aria-label="Buscar productos" />
    </form>

    <nav class="navbar-links" [class.abierto]="menuAbierto">
      <a routerLink="/catalogo" routerLinkActive="active" (click)="menuAbierto = false">Catálogo</a>
      <a routerLink="/pedidos" routerLinkActive="active" (click)="menuAbierto = false">Mis pedidos</a>
      <a routerLink="/rabbitmq" routerLinkActive="active" (click)="menuAbierto = false">RabbitMQ</a>

      <form class="navbar-search-movil" #formularioMovil="ngForm" (ngSubmit)="buscar(formularioMovil)">
        <input type="search" name="qMovil" [(ngModel)]="terminoBusqueda" placeholder="Buscar productos..." />
      </form>

      <div class="navbar-acciones-movil">
        <a routerLink="/carrito" class="navbar-icono" (click)="menuAbierto = false" aria-label="Carrito">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="badge-contador" *ngIf="cantidadCarrito > 0">{{ cantidadCarrito }}</span>
        </a>
        <button *ngIf="!isAutenticado" class="btn btn-primary btn-sm" (click)="login()">Iniciar sesión</button>
        <button *ngIf="isAutenticado" class="btn btn-secondary btn-sm" (click)="cerrarSesionLocal()">Salir</button>
      </div>
    </nav>

    <div class="navbar-acciones">
      <div class="campana">
        <button class="navbar-icono" type="button" (click)="alternarCampana()"
                [attr.aria-expanded]="campanaAbierta" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="badge-contador" *ngIf="notificaciones.length > 0">{{ notificaciones.length }}</span>
        </button>

        <div class="campana-panel" *ngIf="campanaAbierta" (click)="$event.stopPropagation()">
          <div class="campana-cabecera">
            <strong>Notificaciones</strong>
            <button type="button" class="campana-limpiar" (click)="limpiarNotificaciones()"
                    *ngIf="notificaciones.length > 0">Marcar todo leído</button>
          </div>

          <div class="campana-vacia" *ngIf="notificaciones.length === 0">
            Todavía no tienes notificaciones.
          </div>

          <div class="campana-item" *ngFor="let n of notificaciones" [ngClass]="'campana-' + n.tipo">
            <span class="campana-texto">{{ n.texto }}</span>
          </div>
        </div>
      </div>

      <a class="navbar-icono" routerLink="/carrito" aria-label="Carrito de compras">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="badge-contador" *ngIf="cantidadCarrito > 0">{{ cantidadCarrito }}</span>
      </a>

      <ng-container *ngIf="!isAutenticado">
        <button class="btn btn-primary btn-sm" type="button" (click)="login()">Iniciar sesión</button>
      </ng-container>

      <ng-container *ngIf="isAutenticado">
        <div class="navbar-usuario">
          <span class="navbar-avatar" aria-hidden="true">{{ (nombreUsuario || 'U') | slice:0:1 }}</span>
          <span class="navbar-nombre-usuario">{{ nombreUsuario }}</span>
        </div>
        <button class="btn btn-secondary btn-sm" type="button" (click)="cerrarSesionLocal()">Salir</button>
      </ng-container>

      <button class="navbar-burger" type="button" (click)="menuAbierto = !menuAbierto"
              [attr.aria-expanded]="menuAbierto" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="navbar-sombra" *ngIf="campanaAbierta" (click)="campanaAbierta = false"></div>
</header>
