# ESTE ARCHIVO ES UNA PLANTILLA: el Dockerfile lo copia a
# /etc/nginx/templates/ y el entrypoint de la imagen nginx lo procesa con
# envsubst, que SOLO reemplaza las variables de entorno definidas
# (${MS_*_URL}); $host, $uri, $1, etc. quedan tal cual.
# Los valores por defecto (nombres de la red de Docker) estan en
# docker-compose.yml; en multi-EC2 se pisan desde el .env de la instancia
# del frontend con la IP de cada microservicio.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras del reverse proxy: se declaran UNA sola vez a nivel de
    # server y todos los location las heredan (nginx las propaga mientras
    # el location no defina las suyas).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Si el API Gateway (https://<api-id>.execute-api.../desarrollo/...) reenvia
    # el prefijo, se quita y se sirve desde la raiz. El build de produccion ya
    # trae <base href="/desarrollo/">, asi que el navegador siempre pide
    # /desarrollo/<archivo>: funciona con o sin reescritura en el gateway.
    # OJO: es "break" y NO "last" -> no vuelve a buscar location, asi que
    # /desarrollo/carrito y /desarrollo/pedidos (paginas del SPA) no caen en
    # el reverse proxy de abajo (que atiende /carrito y /pedidos).
    location /desarrollo/ {
        rewrite ^/desarrollo/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /desarrollo {
        return 301 /desarrollo/;
    }

    # ------------------------------------------------------------------
    # Reverse proxy: UNA sola puerta de entrada (80) hacia los
    # microservicios. El API Gateway apunta a http://<EC2>:80 y el
    # Security Group no tiene que abrir 8081-8089.
    # Los prefijos coinciden con los @RequestMapping de cada backend:
    #   /productos -> ms-productos:8081   /usuarios -> ms-identidad:8082
    #   /carrito   -> ms-carrito:8083     /pedidos  -> ms-carrito:8083
    #   /ordenes   -> ms-ordenes:8088     /despachos-> ms-despachos:8089
    #   /emails    -> ms-email:8084       /rabbit   -> ms-rabbit-admin:8087
    #   /monitoreo -> ms-monitoreo:8086
    # (ms-pagos 8085 y kafka 9094 NO se exponen: son internos)
    # /emails se expone a proposito para poder probar las notificaciones con
    # Postman (POST /emails/enviar), como pide el enunciado.
    #
    # Cada prefijo se atiende DOS veces: sin prefijo (API Gateway de la
    # logica) y con /desarrollo/ delante (si el gateway del frontend
    # reenvia el path completo hacia la EC2). Asi funciona igual aunque ese
    # gateway reescriba o no la ruta.
    # ------------------------------------------------------------------
    location /productos {
        proxy_pass ${MS_PRODUCTOS_URL};
    }

    location /usuarios {
        proxy_pass ${MS_IDENTIDAD_URL};
    }

    location /carrito {
        proxy_pass ${MS_CARRITO_URL};
    }

    location /pedidos {
        proxy_pass ${MS_CARRITO_URL};
    }

    location /ordenes {
        proxy_pass ${MS_ORDENES_URL};
    }

    location /despachos {
        proxy_pass ${MS_DESPACHOS_URL};
    }

    location /emails {
        proxy_pass ${MS_EMAIL_URL};
    }

    # ms-rabbit-admin expone /queues, /exchanges y /bindings en la RAIZ
    # (no tiene prefijo /rabbit): aqui se lo quitamos para que el backend
    # reciba /queues y no /rabbit/queues (que daria 404).
    # El prefijo /rabbit lo agrega el API Gateway (ruta /rabbit/{proxy+});
    # en local el front se llama igual asi que funciona igual.
    # Con "location /rabbit/" (y no "/rabbit") ademas no se come a la
    # ruta del SPA /rabbitmq.
    location /rabbit/ {
        rewrite ^/rabbit/(.*)$ /$1 break;
        proxy_pass ${MS_RABBIT_URL};
    }

    location /monitoreo {
        proxy_pass ${MS_MONITOREO_URL};
    }

    # --- Misma API con el prefijo /desarrollo/ delante ----------------
    # (busca estos location ANTES que "location /desarrollo/" de arriba:
    #  un location por expresion regular gana sobre el de prefijo)
    location ~ ^/desarrollo/productos(/|$) {
        rewrite ^/desarrollo/(.*)$ /$1 break;
        proxy_pass ${MS_PRODUCTOS_URL};
    }

    location ~ ^/desarrollo/usuarios(/|$) {
        rewrite ^/desarrollo/(.*)$ /$1 break;
        proxy_pass ${MS_IDENTIDAD_URL};
    }

    location ~ ^/desarrollo/carrito(/|$) {
        rewrite ^/desarrollo/(.*)$ /$1 break;
        proxy_pass ${MS_CARRITO_URL};
    }

    location ~ ^/desarrollo/pedidos(/|$) {
        rewrite ^/desarrollo/(.*)$ /$1 break;
        proxy_pass ${MS_CARRITO_URL};
    }

    location ~ ^/desarrollo/ordenes(/|$) {
        rewrite ^/desarrollo/(.*)$ /$1 break;
        proxy_pass ${MS_ORDENES_URL};
    }

    location ~ ^/desarrollo/despachos(/|$) {
        rewrite ^/desarrollo/(.*)$ /$1 break;
        proxy_pass ${MS_DESPACHOS_URL};
    }

    location ~ ^/desarrollo/emails(/|$) {
        rewrite ^/desarrollo/(.*)$ /$1 break;
        proxy_pass ${MS_EMAIL_URL};
    }

    location ~ ^/desarrollo/rabbit(/|$) {
        # quita AMBOS prefijos: /desarrollo/rabbit/... -> /...
        rewrite ^/desarrollo/rabbit(?:/(.*))?$ /$1 break;
        proxy_pass ${MS_RABBIT_URL};
    }

    location ~ ^/desarrollo/monitoreo(/|$) {
        rewrite ^/desarrollo/(.*)$ /$1 break;
        proxy_pass ${MS_MONITOREO_URL};
    }

    # Redirige todas las rutas al index.html para que el router de Angular las maneje
    location / {
        try_files $uri $uri/ /index.html;
    }
}
