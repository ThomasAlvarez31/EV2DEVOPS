server:
  port: 8084

spring:
  application:
    name: ms-email

  # Credenciales SMTP: SIEMPRE por variables de entorno, nunca en el repositorio.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # Broker de mensajes (en docker-compose apunta al servicio "rabbitmq")
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Confirmacion EXPLICITA del consumidor: EmailListener hace basicAck /
        # basicNack sobre el canal (com.rabbitmq.client.Channel). El
        # contenedor NO confirma ni re-encola nada por su cuenta.
        acknowledge-mode: manual
        # Solo un mensaje en vuelo por hilo: si la aplicacion se cae, el
        # mensaje sin confirmar vuelve a la cola (al menos una vez).
        prefetch: 1
        # Nunca se re-encola automaticamente al fallar el listener: la
        # decision de requeue la toma el propio EmailListener.
        default-requeue-rejected: false
        # Sin reintentos del contenedor: los reintentos (con backoff) y el
        # envio a la DLQ estan implementados en EmailListener para que las
        # decisiones de error sean visibles y diferenciadas en el codigo.
        retry:
          enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/9150f81f-b0fc-436d-998d-dcb5cf883d2e/v2.0}

# Prueba local sin Azure (AUTH_BYPASS=true): no se exige JWT.
# Por defecto false => autenticación completa con Microsoft Entra ID.
app:
  auth:
    bypass: ${AUTH_BYPASS:false}
    # Segundo emisor de identidad aceptado: Amazon Cognito (cuentas propias
    # de la tienda). Vacio = solo Microsoft Entra ID.
    cognito-issuer: ${COGNITO_ISSUER_URL:}

pedidos360:
  email:
    from: ${MAIL_FROM:no-reply@pedidos360.cl}

  # ---------------------------------------------------------------
  # Rutas de mensajeria RabbitMQ del dominio de email. Este consumidor
  # declara su cola, su DLQ y sus bindings; EmailListener lee la cola con
  # ${pedidos360.messaging.email.queue}. El EXCHANGE es del sistema y lo
  # declara el productor (ms-carrito) con EXACTAMENTE el mismo nombre
  # (mismos argumentos -> sin PRECONDITION_FAILED).
  # ---------------------------------------------------------------
  messaging:
    email:
      # Exchange directo de eventos de negocio (el productor lo declara).
      exchange: ${MESSAGING_EVENTOS_EXCHANGE:pedidos360.eventos.topic}
      # Cola que consume este microservicio.
      queue: ${MESSAGING_EMAIL_QUEUE:pedidos360.emails}
      # Cola de respaldo (dead letter) si el mensaje no se puede entregar.
      dlq: ${MESSAGING_EMAIL_DLQ:pedidos360.emails.dlq}
      # Binding = exchange + routing key -> cola. Una entrada por ruta.
      routing-keys:
        pedido-registrado: ${MESSAGING_RK_PEDIDO_REGISTRADO:pedido.registrado}
        pago-aprobado: ${MESSAGING_RK_PAGO_APROBADO:pago.aprobado}
        pago-rechazado: ${MESSAGING_RK_PAGO_RECHAZADO:pago.rechazado}
        cambio-estado: ${MESSAGING_RK_CAMBIO_ESTADO:pedido.cambio_estado}
      # Politica de reintentos del consumidor: el ACK/NACK lo decide el
      # propio EmailListener (acknowledge-mode: manual mas abajo), no el
      # contenedor. Agotados los intentos el mensaje va a la DLQ.
      consumer:
        max-attempts: ${MESSAGING_EMAIL_MAX_ATTEMPTS:3}
        retry-delay-ms: ${MESSAGING_EMAIL_RETRY_DELAY_MS:2000}

